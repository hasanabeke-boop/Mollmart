services:
  - type: web
    name: mollmart
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: SERVER_URL
        value: "https://mollmart.onrender.com"
      - key: CORS_ORIGIN
        value: "https://mollmart-azure.vercel.app"
      - key: CORS_ORIGINS
        value: "https://mollmart-azure.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: mollmart-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mollmart-redis
          property: connectionString
      - key: REDIS_ENABLED
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE
        value: "20m"
      - key: REFRESH_TOKEN_EXPIRE
        value: "1d"
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: "jid"
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: DEFAULT_PAGE_SIZE
        value: "20"
      - key: MAX_PAGE_SIZE
        value: "100"
      - key: ALLOW_MULTIPLE_ACTIVE_OFFERS_PER_REQUEST
        value: "false"
      - key: SUBSCRIBE_MODERATION_EVENTS
        value: "true"
      - key: GMAIL_API_CLIENT_ID
        sync: false
      - key: GMAIL_API_CLIENT_SECRET
        sync: false
      - key: GMAIL_API_REFRESH_TOKEN
        sync: false
      - key: GMAIL_API_USER_ID
        value: "me"
      - key: EMAIL_FROM
        value: "nurikesenbaj26@gmail.com"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5-mini"
      - key: R2_ENDPOINT
        value: "https://991ea16d016f4daeff63fc5a37b60026.r2.cloudflarestorage.com"
      - key: R2_BUCKET
        value: "mollmart-uploads"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        value: "https://pub-9608878ec4b341f089680adefaed560f.r2.dev"

  - type: keyvalue
    name: mollmart-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mollmart-postgres
    databaseName: mollmart
    user: mollmart
    plan: basic-256mb
    ipAllowList: []
