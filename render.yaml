services:
  - type: web
    name: mollmart-backend
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: SERVER_URL
        value: "https://mollmart-backend.onrender.com"
      - key: CORS_ORIGIN
        value: "https://mollmart.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: mollmart-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mollmart-redis
          property: connectionString
      - key: REDIS_ENABLED
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE
        value: "20m"
      - key: REFRESH_TOKEN_EXPIRE
        value: "1d"
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: "jid"
      - key: DEFAULT_PAGE_SIZE
        value: "20"
      - key: MAX_PAGE_SIZE
        value: "100"
      - key: ALLOW_MULTIPLE_ACTIVE_OFFERS_PER_REQUEST
        value: "false"
      - key: SUBSCRIBE_MODERATION_EVENTS
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "auto"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5-mini"

  - type: keyvalue
    name: mollmart-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mollmart-postgres
    databaseName: mollmart
    user: mollmart
    plan: basic-256mb
    ipAllowList: []
